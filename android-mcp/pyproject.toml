[project]
name = "android-mcp"
version = "0.1.0"
description = "An MCP server for driving Android devices and BlueStacks instances"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
# The device driver is optional so the parsing layer installs anywhere.
device = ["uiautomator2>=3.0"]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
android-mcp = "android_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["android_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package and the test helpers both import without an installed wheel.
pythonpath = [".", "tests"]
